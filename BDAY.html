<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Neha!</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 60px;
      font-size: 3em;
      animation: fadeIn 2s ease-in;
    }

    p {
      font-size: 1.5em;
      margin: 20px auto;
      width: 80%;
      max-width: 600px;
      animation: fadeIn 3s ease-in;
    }

    button {
      background-color: #fff;
      color: #ff69b4;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ffe4ec;
    }

    #surprise {
      margin-top: 20px;
      font-size: 1.4em;
      display: none;
      animation: fadeIn 1.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Confetti animation */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #fff;
      opacity: 0.7;
      animation: fall 4s infinite linear;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotateZ(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>🎉 Happy Birthday, Neha! 🎉</h1>
  <p>Wishing you joy, laughter, and all the cake you can eat! 🥳</p>
  <button onclick="showSurprise()">Click for a Birthday Surprise!</button>
  <p id="surprise">“Count your life by smiles, not tears. Count your age by friends, not years.” 💖</p>

  <script>
    function showSurprise() {
      document.getElementById('surprise').style.display = 'block';
    }

    // Generate confetti
    for (let i = 0; i < 50; i++) {
      let confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
      confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 75%)`;
      document.body.appendChild(confetti);
    }
  </script>
</body>
</html>
